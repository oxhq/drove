name: Design partner evaluation
description: Volunteer a real Pest or PHPUnit suite for a tagged Drove evaluation
title: "[Design partner]: "
body:
  - type: markdown
    attributes:
      value: |
        This is an evaluation, not an endorsement. Do not include proprietary tests, secrets, or unredacted application output.
  - type: input
    id: project
    attributes:
      label: Project and test stack
      description: Public repository URL or an anonymized application/package description, plus Pest/PHPUnit/Laravel/Testbench versions.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Evaluation environment
      description: Drove tag, PHP version, operating system, architecture, and intended process count.
      placeholder: v0.4.0-alpha.2, PHP 8.4, Linux x86_64, 8 processes
    validations:
      required: true
  - type: textarea
    id: selection
    attributes:
      label: Proposed test selection
      description: Approximate case/file count, bootstrap, database, filesystem, cache, queue, or external-service needs.
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Publishable evidence
      description: What sanitized result may Drove publish?
      options:
        - Named project and normalized result
        - Anonymous project profile and normalized result
        - Private engineering feedback only
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Safety
      options:
        - label: I will not post proprietary source, credentials, secrets, or sensitive application output.
          required: true
