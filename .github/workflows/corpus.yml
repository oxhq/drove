name: Native Corpus Ladder

on:
  pull_request:
  push:
    branches: [develop]
    tags: ['v0.*']
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: native-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  COMPOSER_ROOT_VERSION: 0.4.x-dev

jobs:
  boundary:
    if: github.event_name != 'schedule' || github.repository == 'oxhq/drove'
    name: Native boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Verify native ladder boundary
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          artifact_dir="${RUNNER_TEMP}/native-corpus-boundary"
          mkdir -p "$artifact_dir"
          php -l benchmarks/corpus/verify-native-ladder.php
          php benchmarks/corpus/verify-native-ladder.php \
            | tee "$artifact_dir/native-ladder-boundary.json"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-corpus-boundary-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/native-corpus-boundary/*.json
          if-no-files-found: error
          retention-days: 90

  pest:
    name: Pest native corpus
    needs: boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PEST_COMMIT: 6b2cd358e8a9d6d1abb93804b70e1c659bbc411b

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: ffi, pcntl, posix

      - name: Install gate tooling
        run: composer install --no-interaction --no-progress --ansi

      - name: Clone pinned Pest corpus
        run: |
          set -euo pipefail
          checkout="${RUNNER_TEMP}/pest-native"
          git init "$checkout"
          git -C "$checkout" remote add origin https://github.com/pestphp/pest.git
          git -C "$checkout" fetch --depth=1 origin "$PEST_COMMIT"
          git -C "$checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$checkout" rev-parse HEAD)" = "$PEST_COMMIT"
          test -z "$(git -C "$checkout" status --porcelain=v1 --untracked-files=all)"
          echo "DROVE_PEST_CORPUS=$checkout" >> "$GITHUB_ENV"

      - name: Build native corpus image
        run: |
          set -euo pipefail
          docker build \
            --file experiments/phase-3-laravel/Dockerfile \
            --tag drove-phase-three-laravel \
            .
          docker build \
            --build-arg "DROVE_REVISION=$EXPECTED_SHA" \
            --file benchmarks/corpus/Dockerfile \
            --tag drove-corpus \
            .

      - name: Verify independent Pest baseline
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/native-pest-artifacts"
          mkdir -p "$artifact_dir"
          echo "DROVE_NATIVE_PEST_ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          sh experiments/native-corpus-1/baseline.sh \
            "$DROVE_PEST_CORPUS" \
            "$artifact_dir"

      - name: Run bridge-free Pest matrix
        env:
          DROVE_EXPECTED_REVISION: ${{ env.EXPECTED_SHA }}
        run: |
          set -euo pipefail
          for processes in 1 2 4 8 16 30; do
            DROVE_NATIVE_CORPUS_PROCESSES="$processes" \
              sh experiments/native-corpus-1/run.sh "$DROVE_PEST_CORPUS" \
              > "$DROVE_NATIVE_PEST_ARTIFACT_DIR/pest-native-c${processes}.json"
          done
          test "$(git -C "$DROVE_PEST_CORPUS" rev-parse HEAD)" = "$PEST_COMMIT"
          test -z "$(git -C "$DROVE_PEST_CORPUS" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload Pest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-corpus-pest-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/native-pest-artifacts/*
          if-no-files-found: error
          retention-days: 90

  invoiceshelf:
    name: InvoiceShelf native corpus
    needs: pest
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      INVOICESHELF_COMMIT: 403a4d67225a153838ec126c484339abf60229d1

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: ffi, pcntl, posix

      - name: Install gate tooling
        run: composer install --no-interaction --no-progress --ansi

      - name: Clone pinned InvoiceShelf corpus
        run: |
          set -euo pipefail
          checkout="${RUNNER_TEMP}/invoiceshelf-native"
          git init "$checkout"
          git -C "$checkout" remote add origin https://github.com/InvoiceShelf/InvoiceShelf.git
          git -C "$checkout" fetch --depth=1 origin "$INVOICESHELF_COMMIT"
          git -C "$checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$checkout" rev-parse HEAD)" = "$INVOICESHELF_COMMIT"
          test -z "$(git -C "$checkout" status --porcelain=v1 --untracked-files=all)"
          echo "DROVE_NATIVE_INVOICESHELF_CHECKOUT=$checkout" >> "$GITHUB_ENV"

      - name: Run bridge-free InvoiceShelf gate
        env:
          DROVE_EXPECTED_REVISION: ${{ env.EXPECTED_SHA }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/native-invoiceshelf-artifacts"
          mkdir -p "$artifact_dir"
          DROVE_NATIVE_INVOICESHELF_ARTIFACT_DIR="$artifact_dir" \
            php experiments/native-invoiceshelf-corpus/gate.php
          test "$(git -C "$DROVE_NATIVE_INVOICESHELF_CHECKOUT" rev-parse HEAD)" = "$INVOICESHELF_COMMIT"
          test -z "$(git -C "$DROVE_NATIVE_INVOICESHELF_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload InvoiceShelf evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-corpus-invoiceshelf-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/native-invoiceshelf-artifacts/*.json
          if-no-files-found: error
          retention-days: 90

  livewire:
    name: Livewire native corpus
    needs: invoiceshelf
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LIVEWIRE_COMMIT: 9c1450739d30c9b0b223ad6512be2a33f8f62f96

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: ffi, pcntl, posix

      - name: Install gate tooling
        run: composer install --no-interaction --no-progress --ansi

      - name: Clone pinned Livewire corpus
        run: |
          set -euo pipefail
          checkout="${RUNNER_TEMP}/livewire-native"
          git init "$checkout"
          git -C "$checkout" remote add origin https://github.com/livewire/livewire.git
          git -C "$checkout" fetch --depth=1 origin "$LIVEWIRE_COMMIT"
          git -C "$checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$checkout" rev-parse HEAD)" = "$LIVEWIRE_COMMIT"
          test -z "$(git -C "$checkout" status --porcelain=v1 --untracked-files=all)"
          echo "DROVE_NATIVE_LIVEWIRE_CHECKOUT=$checkout" >> "$GITHUB_ENV"

      - name: Run bridge-free Livewire gate
        env:
          DROVE_EXPECTED_REVISION: ${{ env.EXPECTED_SHA }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/native-livewire-artifacts"
          mkdir -p "$artifact_dir"
          DROVE_NATIVE_LIVEWIRE_ARTIFACT_DIR="$artifact_dir" \
            composer test:native-livewire-package
          test "$(git -C "$DROVE_NATIVE_LIVEWIRE_CHECKOUT" rev-parse HEAD)" = "$LIVEWIRE_COMMIT"
          test -z "$(git -C "$DROVE_NATIVE_LIVEWIRE_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload Livewire evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-corpus-livewire-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/native-livewire-artifacts/*.json
          if-no-files-found: error
          retention-days: 90

  filament:
    name: Filament final native proof
    needs: livewire
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      FILAMENT_COMMIT: e9348b2e3792088ee877068116b6c1e1559a7df8

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: ffi, pcntl, posix

      - name: Install gate tooling
        run: composer install --no-interaction --no-progress --ansi

      - name: Clone pinned Filament corpus
        run: |
          set -euo pipefail
          checkout="${RUNNER_TEMP}/filament-native"
          git init "$checkout"
          git -C "$checkout" remote add origin https://github.com/filamentphp/filament.git
          git -C "$checkout" fetch --depth=1 origin "$FILAMENT_COMMIT"
          git -C "$checkout" checkout --detach FETCH_HEAD
          test "$(git -C "$checkout" rev-parse HEAD)" = "$FILAMENT_COMMIT"
          test -z "$(git -C "$checkout" status --porcelain=v1 --untracked-files=all)"
          echo "DROVE_NATIVE_FILAMENT_CHECKOUT=$checkout" >> "$GITHUB_ENV"

      - name: Run final bridge-free Filament gate
        env:
          DROVE_EXPECTED_REVISION: ${{ env.EXPECTED_SHA }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/native-filament-artifacts"
          mkdir -p "$artifact_dir"
          DROVE_NATIVE_FILAMENT_ARTIFACT_DIR="$artifact_dir" \
            php experiments/native-filament-corpus/gate.php
          test "$(git -C "$DROVE_NATIVE_FILAMENT_CHECKOUT" rev-parse HEAD)" = "$FILAMENT_COMMIT"
          test -z "$(git -C "$DROVE_NATIVE_FILAMENT_CHECKOUT" status --porcelain=v1 --untracked-files=all)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload Filament evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-corpus-filament-${{ env.EXPECTED_SHA }}
          path: ${{ runner.temp }}/native-filament-artifacts/*.json
          if-no-files-found: error
          retention-days: 90
