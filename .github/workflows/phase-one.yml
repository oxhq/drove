name: Drove Phase Gates

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: drove-phase-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase-regressions:
    name: Phase 0-4, kernel, and compatibility proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_DATABASE: drove
          MYSQL_USER: drove
          MYSQL_PASSWORD: drove
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

      redis:
        image: redis:8.2.8-alpine@sha256:3790f265260957949f41e767efd9b66d5e3f277913b63a56c0183d55a47e7347
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout exact head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: Verify exact checkout
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

    - name: Phase 0 regression
      run: |
        set -euo pipefail
        docker build --tag drove-phase-zero experiments/phase-0
        docker run --rm --entrypoint sh drove-phase-zero -lc 'composer validate --strict && composer check-platform-reqs'
        docker run --rm --network host --env REDIS_HOST=127.0.0.1 drove-phase-zero
        docker run --rm drove-phase-zero php failure.php

    - name: Build and validate Phase 1
      run: |
        set -euo pipefail
        docker build --tag drove-phase-one --file experiments/phase-1/Dockerfile .
        docker run --rm --entrypoint sh drove-phase-one -lc 'composer validate --strict && composer check-platform-reqs && composer audit --locked'

    - name: Phase 1 discovery and kernel proofs
      run: |
        set -euo pipefail
        docker run --rm drove-phase-one
        docker run --rm drove-phase-one php inactive.php
        docker run --rm drove-phase-one php kernel.php
        docker run --rm drove-phase-one timeout 15 php scheduler.php
        docker run --rm drove-phase-one timeout 15 php interruption.php
        docker run --rm drove-phase-one php -d ffi.enable=true /pest/native/drover/proof.php

    - name: Phase 2 regression
      run: |
        set -euo pipefail
        docker build --tag drove-phase-two --file experiments/phase-2/Dockerfile .
        docker run --rm --entrypoint sh drove-phase-two -lc 'composer validate --strict && composer check-platform-reqs && composer audit --locked'
        docker run --rm drove-phase-two
        docker run --rm drove-phase-two php kernel-seam.php
        docker run --rm drove-phase-two php renderer.php

    - name: Phase 2 installed Drover runner
      run: |
        set -euo pipefail
        docker build --tag drove-phase-two-cli --file experiments/phase-2-cli/Dockerfile .
        docker run --rm --entrypoint sh drove-phase-two-cli -lc 'composer validate --strict && composer check-platform-reqs && composer audit --locked'
        docker run --rm drove-phase-two-cli
        docker run --rm drove-phase-two-cli php proof-beta.php

    - name: Phase 3 regression
      run: |
        set -euo pipefail
        docker build --tag drove-phase-three --file experiments/phase-3/Dockerfile .
        docker run --rm --entrypoint sh drove-phase-three -lc 'composer validate --strict && composer check-platform-reqs && composer audit --locked'
        docker run --rm drove-phase-three

    - name: Build and validate Phase 3 Laravel alpha
      run: |
        set -euo pipefail
        docker build --tag drove-phase-three-laravel --file experiments/phase-3-laravel/Dockerfile .
        docker run --rm --entrypoint sh drove-phase-three-laravel -lc 'composer validate --strict && composer check-platform-reqs && composer audit --locked'

    - name: Phase 3 Laravel SQLite proof
      run: docker run --rm drove-phase-three-laravel

    - name: Phase 4 Laravel and Testbench proofs
      run: |
        set -euo pipefail
        docker run --rm drove-phase-three-laravel php proof-state-capabilities.php
        docker run --rm drove-phase-three-laravel php proof-testbench-guards.php
        docker run --rm drove-phase-three-laravel php proof-testbench.php
        docker run --rm drove-phase-three-laravel php proof-data-provider.php

    - name: Phase 3 Laravel MySQL transaction proof
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        docker run --rm \
          --network host \
          --env DB_HOST=127.0.0.1 \
          --env DB_PORT=3306 \
          --env DB_DATABASE=drove \
          --env DB_USERNAME=drove \
          --env DB_PASSWORD=drove \
          drove-phase-three-laravel php proof-mysql.php

        artifact_dir="${RUNNER_TEMP}/native-laravel-transaction"
        mkdir -p "$artifact_dir"
        docker run --rm \
          --network host \
          --env DB_HOST=127.0.0.1 \
          --env DB_PORT=3306 \
          --env DB_DATABASE=drove \
          --env DB_USERNAME=drove \
          --env DB_PASSWORD=drove \
          --env DROVE_EVIDENCE_REVISION="$EXPECTED_SHA" \
          drove-phase-three-laravel \
          php -d ffi.enable=true native-phase-4/faults.php transaction \
          | tee "$artifact_dir/transaction-faults.json"
        php -r '
          $proof = json_decode(file_get_contents($argv[1]), true, 128, JSON_THROW_ON_ERROR);
          if (($proof["schema"] ?? null) !== 1
              || ($proof["ok"] ?? null) !== true
              || ($proof["evidence_revision"] ?? null) !== getenv("EXPECTED_SHA")
              || ($proof["providers"] ?? null) !== ["transaction"]
              || ($proof["case_count"] ?? null) !== 4
              || ($proof["prepare_failure_case_count"] ?? null) !== 1
              || ($proof["provider_internal_partial_failure_case_count"] ?? null) !== 3) {
              throw new RuntimeException("Native transaction fault matrix is invalid.");
          }
        ' "$artifact_dir/transaction-faults.json"

    - name: Upload native transaction fault evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-laravel-transaction-faults-${{ github.event.pull_request.head.sha || github.sha }}
        path: ${{ runner.temp }}/native-laravel-transaction/*.json
        if-no-files-found: error
        retention-days: 90
