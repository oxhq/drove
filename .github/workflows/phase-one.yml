name: Drove Phase 1

on:
  push:
    branches: [5.x, refactor/phase-1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: drove-phase-one-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phase-regressions:
    name: Phase 0-3 and kernel proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      redis:
        image: redis:8.2.8-alpine@sha256:3790f265260957949f41e767efd9b66d5e3f277913b63a56c0183d55a47e7347
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout exact head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: Verify exact checkout
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

    - name: Phase 0 regression
      run: |
        set -euo pipefail
        docker build --tag drove-phase-zero experiments/phase-0
        docker run --rm --entrypoint sh drove-phase-zero -lc 'composer validate --strict && composer check-platform-reqs'
        docker run --rm --network host --env REDIS_HOST=127.0.0.1 drove-phase-zero
        docker run --rm drove-phase-zero php failure.php

    - name: Build and validate Phase 1
      run: |
        set -euo pipefail
        docker build --tag drove-phase-one --file experiments/phase-1/Dockerfile .
        docker run --rm --entrypoint sh drove-phase-one -lc 'composer validate --strict && composer check-platform-reqs && composer audit --locked'

    - name: Phase 1 discovery and kernel proofs
      run: |
        set -euo pipefail
        docker run --rm drove-phase-one
        docker run --rm drove-phase-one php inactive.php
        docker run --rm drove-phase-one php kernel.php
        docker run --rm drove-phase-one timeout 15 php scheduler.php

    - name: Phase 2 regression
      run: |
        set -euo pipefail
        docker build --tag drove-phase-two --file experiments/phase-2/Dockerfile .
        docker run --rm --entrypoint sh drove-phase-two -lc 'composer validate --strict && composer check-platform-reqs && composer audit --locked'
        docker run --rm drove-phase-two

    - name: Phase 3 regression
      run: |
        set -euo pipefail
        docker build --tag drove-phase-three --file experiments/phase-3/Dockerfile .
        docker run --rm --entrypoint sh drove-phase-three -lc 'composer validate --strict && composer check-platform-reqs && composer audit --locked'
        docker run --rm drove-phase-three
