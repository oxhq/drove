name: Tests

on:
  push:
    branches: [develop]
  pull_request:
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule' || github.repository == 'oxhq/drove'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest] # windows-latest
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }} - ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v2
        coverage: none
        extensions: ffi, pcntl, posix, sockets

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ matrix.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json', '**/composer.lock') }}
        restore-keys: |
          ${{ matrix.os }}-php-${{ matrix.php }}-composer-

    - name: Setup Problem Matches
      run: |
        echo "::add-matcher::${{ runner.tool_cache }}/php.json"
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Install PHP dependencies
      shell: bash
      env:
        COMPOSER_ROOT_VERSION: 0.4.x-dev
      run: composer install --no-interaction --no-progress --ansi

    - name: Validate package metadata
      run: composer validate --strict && composer check-platform-reqs

    - name: Unit Tests
      run: composer test:unit

    - name: Parallel Tests
      run: composer test:parallel

    - name: Integration Tests
      run: composer test:integration
