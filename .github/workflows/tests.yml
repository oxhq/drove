name: Tests

on:
  push:
    branches: [develop]
  pull_request:
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'schedule' || github.repository == 'oxhq/drove'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest] # windows-latest
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }} - ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v2
        coverage: none
        extensions: ffi, pcntl, posix, sockets

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ matrix.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json', '**/composer.lock') }}
        restore-keys: |
          ${{ matrix.os }}-php-${{ matrix.php }}-composer-

    - name: Setup Problem Matches
      run: |
        echo "::add-matcher::${{ runner.tool_cache }}/php.json"
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

    - name: Install PHP dependencies
      shell: bash
      env:
        COMPOSER_ROOT_VERSION: 0.4.x-dev
      run: composer install --no-interaction --no-progress --ansi

    - name: Validate package metadata
      run: composer validate --strict && composer check-platform-reqs

    - name: Native Phase 1 targeted static analysis
      if: matrix.os == 'ubuntu-latest' && matrix.php == '8.4'
      run: composer test:native-phase-1:static

    - name: Native class frontend and pinned Livewire migration
      if: matrix.os == 'ubuntu-latest' && matrix.php == '8.4'
      shell: bash
      run: |
        set -euo pipefail
        git init .temp/livewire-native-inspect
        git -C .temp/livewire-native-inspect remote add origin https://github.com/livewire/livewire.git
        git -C .temp/livewire-native-inspect fetch --depth=1 origin 9c1450739d30c9b0b223ad6512be2a33f8f62f96
        git -C .temp/livewire-native-inspect checkout --detach FETCH_HEAD
        test "$(git -C .temp/livewire-native-inspect rev-parse HEAD)" = 9c1450739d30c9b0b223ad6512be2a33f8f62f96
        test -z "$(git -C .temp/livewire-native-inspect status --porcelain)"
        composer test:native-expectation-catalog
        composer test:native-expectation-catalog:static
        composer test:native-corpus-inventory
        composer test:native-corpus-inventory:static
        composer test:native-benchmark
        composer test:native-benchmark:static
        composer test:native-class-frontend
        composer test:native-class-migration
        composer test:native-class-migration:static
        composer test:native-laravel-migration:static
        composer test:native-corpus-1:static

    - name: Native Phase 1 C1/C4 parity
      if: matrix.os == 'ubuntu-latest' && matrix.php == '8.4'
      shell: bash
      run: |
        set -euo pipefail
        artifact_dir="${RUNNER_TEMP}/native-phase-1"
        mkdir -p "$artifact_dir"
        c1="${artifact_dir}/drove-native-c1.json"
        c4="${artifact_dir}/drove-native-c4.json"
        comparison="${artifact_dir}/drove-native-comparison.json"
        DROVE_NATIVE_SCHEDULER=pcntl DROVE_NATIVE_PROCESSES=1 php experiments/native-phase-1/proof.php > "$c1"
        DROVE_NATIVE_SCHEDULER=pcntl DROVE_NATIVE_PROCESSES=4 php experiments/native-phase-1/proof.php > "$c4"
        php -r '
          $read = static function (string $path): array {
              $json = file_get_contents($path);
              if ($json === false || trim($json) === "") {
                  throw new RuntimeException("Native Phase 1 summary is missing or empty: ".$path);
              }

              $summary = json_decode($json, true, 512, JSON_THROW_ON_ERROR);
              if (! is_array($summary)) {
                  throw new RuntimeException("Native Phase 1 summary must be a JSON object: ".$path);
              }

              return $summary;
          };
          $validate = static function (array $summary, int $processes, string $label): array {
              foreach (["schema", "ok", "run_status", "exit_code", "scheduler", "processes", "observed_concurrency", "executor_pids", "fork_isolation_checked", "dependency_guard_checked", "bootstrap_isolation_checked", "lifecycle_checked", "test_count", "plan_hash", "semantic_hash", "tests"] as $field) {
                  if (! array_key_exists($field, $summary)) {
                      throw new RuntimeException($label." summary is missing ".$field.".");
                  }
              }
              if ($summary["schema"] !== 1
                  || $summary["ok"] !== true
                  || $summary["run_status"] !== "failed"
                  || $summary["exit_code"] !== 1
                  || $summary["scheduler"] !== "pcntl"
                  || $summary["processes"] !== $processes
                  || $summary["observed_concurrency"] !== $processes
                  || $summary["fork_isolation_checked"] !== true
                  || $summary["dependency_guard_checked"] !== true
                  || $summary["bootstrap_isolation_checked"] !== true
                  || ($summary["lifecycle_checked"]["nested_trace"] ?? null) !== ["before_each", "before_each", "after_each", "after_each"]
                  || ($summary["lifecycle_checked"]["failed_trace"] ?? null) !== ["before_each:passed", "before_each:passed", "after_each:passed", "after_each:passed"]
                  || ($summary["lifecycle_checked"]["scope_hook_counts"] ?? null) !== ["before_all" => 2, "after_all" => 2]
                  || $summary["test_count"] !== 13) {
                  throw new RuntimeException($label." summary contains invalid proof metrics.");
              }
              foreach (["plan_hash", "semantic_hash"] as $field) {
                  if (! is_string($summary[$field]) || preg_match("/^[a-f0-9]{64}$/D", $summary[$field]) !== 1) {
                      throw new RuntimeException($label." ".$field." must be a SHA-256 hash.");
                  }
              }
              if (! is_array($summary["executor_pids"])
                  || ! array_is_list($summary["executor_pids"])
                  || count($summary["executor_pids"]) !== 13
                  || count(array_unique($summary["executor_pids"], SORT_REGULAR)) !== 13) {
                  throw new RuntimeException($label." executor_pids must contain thirteen unique PIDs.");
              }
              foreach ($summary["executor_pids"] as $pid) {
                  if (! is_int($pid) || $pid <= 0) {
                      throw new RuntimeException($label." executor_pids must be positive integers.");
                  }
              }
              if (! is_array($summary["tests"]) || ! array_is_list($summary["tests"]) || count($summary["tests"]) !== 13) {
                  throw new RuntimeException($label." tests must contain exactly thirteen results.");
              }

              return [
                  "schema" => $summary["schema"],
                  "ok" => $summary["ok"],
                  "run_status" => $summary["run_status"],
                  "exit_code" => $summary["exit_code"],
                  "scheduler" => $summary["scheduler"],
                  "processes" => $summary["processes"],
                  "observed_concurrency" => $summary["observed_concurrency"],
                  "executor_pids" => $summary["executor_pids"],
                  "fork_isolation_checked" => $summary["fork_isolation_checked"],
                  "dependency_guard_checked" => $summary["dependency_guard_checked"],
                  "bootstrap_isolation_checked" => $summary["bootstrap_isolation_checked"],
                  "lifecycle_checked" => $summary["lifecycle_checked"],
                  "test_count" => $summary["test_count"],
                  "plan_hash" => $summary["plan_hash"],
                  "semantic_hash" => $summary["semantic_hash"],
                  "tests" => $summary["tests"],
              ];
          };

          $c1 = $validate($read($argv[1]), 1, "C1");
          $c4 = $validate($read($argv[2]), 4, "C4");
          if (! hash_equals($c1["plan_hash"], $c4["plan_hash"]) || ! hash_equals($c1["semantic_hash"], $c4["semantic_hash"])) {
              throw new RuntimeException("Native Phase 1 diverged between C1 and C4.");
          }
          $revision = getenv("GITHUB_SHA");
          $runnerOs = getenv("RUNNER_OS");
          $runnerArch = getenv("RUNNER_ARCH");
          if (! is_string($revision) || trim($revision) === "" || ! is_string($runnerOs) || trim($runnerOs) === "" || ! is_string($runnerArch) || trim($runnerArch) === "") {
              throw new RuntimeException("Native Phase 1 revision and platform metadata are required.");
          }

          $comparison = [
              "schema_version" => 1,
              "revision" => $revision,
              "platform" => [
                  "os" => $runnerOs,
                  "architecture" => $runnerArch,
                  "php" => PHP_VERSION,
              ],
              "runs" => [
                  "c1" => $c1,
                  "c4" => $c4,
              ],
              "parity" => [
                  "plan_hash" => $c1["plan_hash"],
                  "semantic_hash" => $c1["semantic_hash"],
              ],
          ];
          $json = json_encode($comparison, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR).PHP_EOL;
          if (file_put_contents($argv[3], $json) === false) {
              throw new RuntimeException("Could not write normalized Native Phase 1 comparison.");
          }
        ' "$c1" "$c4" "$comparison"

    - name: Upload Native Phase 1 parity evidence
      if: always() && matrix.os == 'ubuntu-latest' && matrix.php == '8.4'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-phase-1-${{ github.sha }}-php84-ubuntu
        path: ${{ runner.temp }}/native-phase-1/*.json
        if-no-files-found: error
        retention-days: 90

    - name: Unit Tests
      run: composer test:unit

    - name: Parallel Tests
      run: composer test:parallel

    - name: Integration Tests
      run: composer test:integration
