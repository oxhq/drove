name: Native release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: drove-native-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-gnu-x86_64
            machine: x86_64
            library: target/release/libdrover.so
          - runner: ubuntu-24.04-arm
            target: linux-gnu-aarch64
            machine: aarch64
            library: target/release/libdrover.so
          - runner: macos-15-intel
            target: macos-x86_64
            machine: x86_64
            library: target/release/libdrover.dylib
          - runner: macos-15
            target: macos-aarch64
            machine: arm64
            library: target/release/libdrover.dylib

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout and release tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          test -z "$(git status --porcelain=v1)"
          test "$(uname -m)" = "${{ matrix.machine }}"
          git fetch --no-tags origin \
            refs/heads/develop:refs/remotes/origin/develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
              echo "Native releases require a v0.x.y-alpha.n tag." >&2
              exit 1
            fi
            if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
              echo "Native releases require an annotated tag." >&2
              exit 1
            fi
            test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"
          fi

      - name: Install Rust 1.88
        if: startsWith(matrix.target, 'macos-')
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0

      - name: Install PHP 8.4 with FFI
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: '8.4'
          extensions: ffi, pcntl
          coverage: none

      - name: Verify candidate release identity
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            php scripts/verify-release-version.php "$GITHUB_REF_NAME"
          else
            php scripts/verify-release-version.php
          fi

      - name: Test and build Drover on glibc 2.31
        if: startsWith(matrix.target, 'linux-gnu-')
        env:
          NATIVE_IMAGE: drove-native-${{ matrix.target }}
        run: |
          set -euo pipefail
          docker build \
            --file native/drover/Dockerfile \
            --tag "$NATIVE_IMAGE" \
            .
          test "$(
            docker run --rm --entrypoint getconf "$NATIVE_IMAGE" GNU_LIBC_VERSION
          )" = "glibc 2.31"
          docker run --rm "$NATIVE_IMAGE"
          reproduction_image="$NATIVE_IMAGE-reproduction"
          docker build \
            --no-cache \
            --target native-builder \
            --file native/drover/Dockerfile \
            --tag "$reproduction_image" \
            .
          container="$(docker create "$NATIVE_IMAGE")"
          reproduction_container="$(docker create "$reproduction_image")"
          trap 'docker rm -f "$container" "$reproduction_container" >/dev/null 2>&1 || true' EXIT
          mkdir -p native/drover/target/release
          docker cp \
            "$container:/usr/local/lib/libdrover.so" \
            native/drover/target/release/libdrover.so
          docker cp \
            "$reproduction_container:/build/target/release/libdrover.so" \
            "$RUNNER_TEMP/libdrover-reproduction.so"
          cmp \
            native/drover/target/release/libdrover.so \
            "$RUNNER_TEMP/libdrover-reproduction.so"

      - name: Test and build Drover on macOS
        if: startsWith(matrix.target, 'macos-')
        working-directory: native/drover
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked -- --test-threads=1
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
          CARGO_TARGET_DIR="$RUNNER_TEMP/drover-reproduction" \
            cargo build --release --locked
          cmp \
            target/release/libdrover.dylib \
            "$RUNNER_TEMP/drover-reproduction/release/libdrover.dylib"

      - name: Package checksummed overlay
        env:
          DROVER_TARGET: ${{ matrix.target }}
          DROVER_LIBRARY: ${{ matrix.library }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/native"
          reproduction="$RUNNER_TEMP/native-reproduction"
          source_revision="$(git rev-parse HEAD)"
          bash scripts/package-native.sh \
            "$DROVER_TARGET" \
            "native/drover/$DROVER_LIBRARY" \
            "$output" \
            "$source_revision"
          sleep 1
          bash scripts/package-native.sh \
            "$DROVER_TARGET" \
            "native/drover/$DROVER_LIBRARY" \
            "$reproduction" \
            "$source_revision"
          cd "$output"
          asset="drove-native-$DROVER_TARGET.tar.gz"
          checksum="$asset.sha256"
          provenance="drove-native-$DROVER_TARGET.provenance.json"
          shasum -a 256 --check "$checksum"
          cmp "$asset" "$reproduction/$asset"
          cmp "$checksum" "$reproduction/$checksum"
          cmp "$provenance" "$reproduction/$provenance"
          php -r '
            $manifest = json_decode(
                file_get_contents($argv[1]),
                true,
                flags: JSON_THROW_ON_ERROR,
            );
            exit(
                ($manifest["schema"] ?? null) === 1
                && ($manifest["source_revision"] ?? null) === $argv[2]
                && ($manifest["target"] ?? null) === $argv[3]
                && ($manifest["archive"]["name"] ?? null) === $argv[4]
                && ($manifest["archive"]["sha256"] ?? null)
                    === hash_file("sha256", $argv[4])
                    ? 0
                    : 1,
            );
          ' "$provenance" "$source_revision" "$DROVER_TARGET" "$asset"

      - name: Attest release archive provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/native/drove-native-${{ matrix.target }}.tar.gz

      - name: Verify archive, resolver, and ABI
        env:
          DROVER_EXPECT_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/native/drove-native-$DROVER_EXPECT_TARGET.tar.gz"
          tar -xzf "$asset" -C "$GITHUB_WORKSPACE"
          if [[ "$DROVER_EXPECT_TARGET" == macos-* ]]; then
            filename="libdrover.dylib"
          else
            filename="libdrover.so"
          fi
          expected="native/drover/prebuilt/$DROVER_EXPECT_TARGET/$filename"
          test "$(tar -tzf "$asset" | sed '/\/$/d')" = "$expected"
          library="$GITHUB_WORKSPACE/native/drover/prebuilt/$DROVER_EXPECT_TARGET/$filename"
          DROVER_EXPECT_LIBRARY="$library" \
            php -d ffi.enable=true native/drover/resolver-proof.php
          DROVER_LIBRARY="$library" \
            php -d ffi.enable=true native/drover/proof.php
          cc native/drover/abi-smoke.c \
            "$library" \
            "-Wl,-rpath,$(dirname "$library")" \
            -o "$RUNNER_TEMP/drover-abi-smoke"
          "$RUNNER_TEMP/drover-abi-smoke"

      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drove-native-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native/drove-native-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/native/drove-native-${{ matrix.target }}.tar.gz.sha256
            ${{ runner.temp }}/native/drove-native-${{ matrix.target }}.provenance.json
          if-no-files-found: error

  release:
    name: Publish native release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: write

    steps:
      - name: Checkout exact annotated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          test -z "$(git status --porcelain=v1)"
          git fetch --no-tags origin \
            refs/heads/develop:refs/remotes/origin/develop
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/develop)"
          if [[ ! "$GITHUB_REF_NAME" =~ ^v0\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Native releases require a v0.x.y-alpha.n tag." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "Native releases require an annotated tag." >&2
            exit 1
          fi
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$(git rev-parse HEAD)"

      - name: Require successful full corpus at release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          artifact_name="corpus-full-$release_sha"
          run_id="$(
            gh api "repos/$GH_REPO/actions/artifacts?name=$artifact_name&per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$artifact_name\" and .expired == false and .workflow_run.head_sha == \"$release_sha\")][0].workflow_run.id // empty"
          )"
          test -n "$run_id"
          run="$(
            gh api "repos/$GH_REPO/actions/runs/$run_id" \
              --jq '[.conclusion, .event, .path, .head_sha] | @tsv'
          )"
          test "$run" = "success	workflow_dispatch	.github/workflows/corpus.yml	$release_sha"
          echo "Full corpus release gate: run $run_id"

      - name: Require successful develop workflows at release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          workflows=(
            static.yml
            tests.yml
            phase-one.yml
            release-gates.yml
            native-dsl.yml
            native-extensions.yml
            native-laravel.yml
            native-topology.yml
            bridge-coverage.yml
          )
          for workflow in "${workflows[@]}"; do
            details="$(
              gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?branch=develop&event=push&head_sha=$release_sha&status=success&per_page=1" \
                --jq '.workflow_runs[0] | [.id, .conclusion, .event, .path, .head_sha] | @tsv'
            )"
            IFS=$'\t' read -r run_id conclusion event path head_sha <<<"$details"
            test -n "$run_id"
            test "$conclusion" = success
            test "$event" = push
            test "$path" = ".github/workflows/$workflow"
            test "$head_sha" = "$release_sha"
            echo "$workflow release gate: run $run_id"
          done

      - name: Require external design-partner evidence
        run: |
          set -euo pipefail
          php scripts/verify-design-partners.php \
            docs/design-partner-evidence.json \
            "$GITHUB_REF_NAME" \
            "$(git rev-parse HEAD)"

      - name: Download native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: drove-native-*
          path: release
          merge-multiple: true

      - name: Verify and publish immutable experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          targets=(
            linux-gnu-x86_64
            linux-gnu-aarch64
            macos-x86_64
            macos-aarch64
          )
          release_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          signer_workflow="${GITHUB_SERVER_URL#https://}/$GITHUB_REPOSITORY/.github/workflows/native-release.yml"
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 12
          for target in "${targets[@]}"; do
            archive="drove-native-$target.tar.gz"
            checksum="$archive.sha256"
            provenance="drove-native-$target.provenance.json"
            test -f "$archive"
            test -f "$checksum"
            test -f "$provenance"
            shasum -a 256 --check "$checksum"
            php -r '
              $manifest = json_decode(
                  file_get_contents($argv[1]),
                  true,
                  flags: JSON_THROW_ON_ERROR,
              );
              exit(
                  ($manifest["schema"] ?? null) === 1
                  && ($manifest["source_revision"] ?? null) === $argv[2]
                  && ($manifest["target"] ?? null) === $argv[3]
                  && ($manifest["archive"]["name"] ?? null) === $argv[4]
                  && ($manifest["archive"]["sha256"] ?? null)
                      === hash_file("sha256", $argv[4])
                      ? 0
                      : 1,
              );
            ' "$provenance" "$release_sha" "$target" "$archive"
            gh attestation verify "$archive" \
              --repo "$GH_REPO" \
              --signer-workflow "$signer_workflow" \
              --source-digest "$release_sha" \
              --source-ref "refs/tags/$GITHUB_REF_NAME" \
              --deny-self-hosted-runners
          done
          cat ./*.tar.gz.sha256 | LC_ALL=C sort > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace its assets." >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/drove-native-release-notes.md"
          {
            echo "# Drove $GITHUB_REF_NAME"
            echo
            echo "Experimental alpha release of the independent Drove prepared-state test runner."
            echo
            echo "The four attached native Drover archives target glibc 2.31+ Linux and macOS on x86_64 and ARM64. Alpine and other musl systems are not supported."
            echo
            echo "Each archive has a SHA-256 checksum, normalized provenance manifest, and GitHub build-provenance attestation. Verify with \`gh attestation verify <archive> --repo $GH_REPO --signer-workflow $signer_workflow --source-digest $release_sha --source-ref refs/tags/$GITHUB_REF_NAME --deny-self-hosted-runners\`."
            echo
            echo "Bridge Coverage gates PCOV 1.0.12 line coverage only through the Pest/PHPUnit bridge. The native frontend rejects coverage options and does not declare coverage support."
            echo
            echo "Native guarantees, bridge-only compatibility, unsupported surfaces, and migration guidance are versioned in the tagged README and docs. CI artifacts do not by themselves establish the external design-partner gate."
            echo
            echo "Historical repository tags through v5.0.1 belong to the Pest lineage and are not prior Drove releases."
          } > "$notes"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "Drove $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            ./*.tar.gz \
            ./*.tar.gz.sha256 \
            ./*.provenance.json \
            SHA256SUMS
