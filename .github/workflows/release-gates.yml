name: Release Gates

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: release-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-native-laravel:
    name: macOS ${{ matrix.arch }} native and Laravel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15-intel
          arch: x86_64
          target: macos-x86_64
        - os: macos-15
          arch: arm64
          target: macos-aarch64

    steps:
    - name: Checkout exact head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: Verify exact checkout and architecture
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        EXPECTED_ARCH: ${{ matrix.arch }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        test "$(uname -m)" = "$EXPECTED_ARCH"

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.4'
        tools: composer:v2
        coverage: none
        extensions: ffi, pcntl, pdo_mysql, pdo_sqlite, posix, sockets

    - name: Build local native library
      working-directory: native/drover
      run: |
        set -euo pipefail
        rustup toolchain install 1.88.0 --profile minimal
        cargo +1.88.0 build --release --locked
        test "$(lipo -archs target/release/libdrover.dylib)" = "${{ matrix.arch }}"

    - name: Install and validate root package
      env:
        COMPOSER_ROOT_VERSION: 0.4.x-dev
        DROVER_EXPECT_LIBRARY: ${{ github.workspace }}/native/drover/target/release/libdrover.dylib
        DROVER_EXPECT_TARGET: ${{ matrix.target }}
        DROVER_LIBRARY: ${{ github.workspace }}/native/drover/target/release/libdrover.dylib
      run: |
        set -euo pipefail
        composer install --no-interaction --no-progress --ansi
        composer validate --strict
        composer check-platform-reqs
        php native/drover/resolver-proof.php
        php -d ffi.enable=true native/drover/proof.php
        php -d ffi.enable=true bin/drove --version

    - name: Install Laravel and Testbench proof
      env:
        COMPOSER_ROOT_VERSION: 0.4.0-alpha.1
      run: |
        set -euo pipefail
        mkdir -p experiments/phase-3-laravel/{bootstrap/cache,database,storage/framework/{cache,drove,drove-proof,drove-proof-mysql,sessions,views},storage/logs}
        touch experiments/phase-3-laravel/database/database.sqlite
        composer --working-dir=experiments/phase-3-laravel install \
          --no-interaction --no-progress --ansi
        composer --working-dir=experiments/phase-3-laravel validate --strict
        composer --working-dir=experiments/phase-3-laravel check-platform-reqs

    - name: Prove resource capabilities and Testbench at every width
      env:
        DROVER_LIBRARY: ${{ github.workspace }}/native/drover/target/release/libdrover.dylib
      working-directory: experiments/phase-3-laravel
      run: |
        set -euo pipefail
        php proof-state-capabilities.php
        php proof-testbench-guards.php
        for processes in 1 2 4 8
        do
          DROVE_PROOF_PROCESSES="$processes" php proof-testbench.php
        done

  composer-archive:
    name: Composer archive contents
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - name: Checkout exact head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Verify exact checkout
      env:
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.4'
        tools: composer:v2
        coverage: none
        extensions: ffi, pcntl, posix

    - name: Prove design-partner release verifier
      run: php scripts/verify-design-partners-self-test.php

    - name: Prove candidate release identity
      run: |
        set -euo pipefail
        php scripts/verify-release-version.php
        set +e
        php scripts/verify-release-version.php v0.4.0-alpha.1 \
          > "$RUNNER_TEMP/release-version-mismatch.txt" 2>&1
        mismatch_exit="$?"
        set -e
        test "$mismatch_exit" -ne 0
        grep -Fq \
          'DROVE_RELEASE_VERSION_MISMATCH: expected v0.4.0-alpha.2, received v0.4.0-alpha.1.' \
          "$RUNNER_TEMP/release-version-mismatch.txt"

    - name: Prove native and bridge package boundary
      run: composer test:package-boundary

    - name: Prove installable archive contents
      run: |
        set -euo pipefail
        archive_directory="$RUNNER_TEMP/drove-archive"
        contents="$RUNNER_TEMP/drove-archive-contents.txt"
        top_level="$RUNNER_TEMP/drove-archive-top-level.txt"
        expected_top_level="$RUNNER_TEMP/drove-archive-expected-top-level.txt"

        composer validate --strict
        composer archive --format=tar --dir="$archive_directory" \
          --file=drove --no-interaction
        tar -tf "$archive_directory/drove.tar" \
          | sed '/\/$/d; /^$/d' \
          | LC_ALL=C sort -u > "$contents"
        cut -d/ -f1 "$contents" | LC_ALL=C sort -u > "$top_level"

        cat > "$expected_top_level" <<'EOF'
        LICENSE.md
        README.md
        bin
        composer.json
        docs
        native
        overrides
        resources
        src
        stubs
        EOF
        diff -u "$expected_top_level" "$top_level"

        for required in \
          LICENSE.md \
          README.md \
          bin/drove \
          bin/drove-install-native \
          bin/pest \
          composer.json \
          docs/design-partner-evidence.json \
          docs/design-partner-validation.md \
          docs/migration-from-pest.md \
          docs/package-boundary.md \
          native/drover/README.md \
          resources/release.json \
          resources/drove-compatibility.json \
          src/Drove/Bridge/Pest/Bootstrap.php \
          src/Drove/Kernel/DroverScheduler.php \
          src/Drove/Kernel/NativeLibrary.php
        do
          grep -Fqx "$required" "$contents"
        done

        test "$(grep '^native/' "$contents")" = "native/drover/README.md"
        sha256sum "$archive_directory/drove.tar" "$contents"

        package="$RUNNER_TEMP/drove-package"
        native_consumer="$RUNNER_TEMP/drove-native-consumer"
        bridge_consumer="$RUNNER_TEMP/drove-bridge-consumer"
        mkdir -p "$package" "$native_consumer" "$bridge_consumer"
        tar -xf "$archive_directory/drove.tar" -C "$package"
        cat > "$native_consumer/composer.json" <<JSON
        {
          "name": "drove/native-archive-consumer",
          "type": "project",
          "repositories": [
            {
              "type": "path",
              "url": "$package",
              "options": {
                "symlink": false,
                "versions": {
                  "oxhq/drove": "0.4.0-alpha.2"
                }
              }
            }
          ],
          "require": {
            "oxhq/drove": "0.4.0-alpha.2"
          }
        }
        JSON
        composer --working-dir="$native_consumer" install \
          --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader
        test ! -L "$native_consumer/vendor/oxhq/drove"
        php scripts/verify-package-boundary.php \
          "$package/composer.json" \
          "$package/resources/drove-bridge-compatibility.json"
        for bridge_dependency in \
          brianium/paratest \
          nunomaduro/collision \
          nunomaduro/termwind \
          pestphp/pest-plugin \
          phpunit/phpunit \
          symfony/process
        do
          if composer --working-dir="$native_consumer" show "$bridge_dependency" \
            >/dev/null 2>&1
          then
            echo "$bridge_dependency leaked into the native package" >&2
            exit 1
          fi
        done
        cat > "$native_consumer/native-boundary.php" <<'PHP'
        <?php

        require __DIR__.'/vendor/autoload.php';

        if (! function_exists('Drove\Native\test')
            || function_exists('test')
            || function_exists('expect')
            || class_exists('Pest\Kernel')
            || class_exists('PHPUnit\Framework\TestCase')) {
            throw new RuntimeException('The native package autoloaded a compatibility frontend.');
        }
        PHP
        php "$native_consumer/native-boundary.php"
        test "$("$native_consumer/vendor/bin/drove" --version)" = "Drove 0.4.0-alpha.2"
        test "$("$native_consumer/vendor/bin/drove" --native --version)" = "Drove 0.4.0-alpha.2"
        "$native_consumer/vendor/bin/drove" --help \
          | grep -Fq 'Drove native'
        set +e
        "$native_consumer/vendor/bin/drove" --pest --version \
          >"$native_consumer/missing-bridge.txt" 2>&1
        missing_bridge_exit="$?"
        set -e
        test "$missing_bridge_exit" -eq 2
        grep -Fq 'DROVE_PEST_BRIDGE_MISSING_DEPENDENCIES' \
          "$native_consumer/missing-bridge.txt"
        "$native_consumer/vendor/bin/drove" --compatibility \
          > "$native_consumer/compatibility.json"
        php -r '
          $registry = json_decode(
              file_get_contents($argv[1]),
              true,
              flags: JSON_THROW_ON_ERROR,
          );
          exit(
              ($registry["schema"] ?? null) === 1
              && ($registry["drove_version"] ?? null) === "0.4.0-alpha.2"
                  ? 0
                  : 1,
          );
        ' "$native_consumer/compatibility.json"

        cat > "$bridge_consumer/composer.json" <<JSON
        {
          "name": "drove/bridge-archive-consumer",
          "type": "project",
          "repositories": [
            {
              "type": "path",
              "url": "$package",
              "options": {
                "symlink": false,
                "versions": {
                  "oxhq/drove": "0.4.0-alpha.2"
                }
              }
            }
          ],
          "require-dev": {
            "brianium/paratest": "7.23.0",
            "nunomaduro/collision": "8.9.5",
            "nunomaduro/termwind": "2.4.0",
            "oxhq/drove": "0.4.0-alpha.2",
            "pestphp/pest-plugin": "5.0.0",
            "phpunit/phpunit": "13.2.4",
            "symfony/process": "8.1.0"
          },
          "config": {
            "allow-plugins": {
              "pestphp/pest-plugin": true
            }
          }
        }
        JSON
        composer --working-dir="$bridge_consumer" install \
          --no-interaction --no-progress --prefer-dist --optimize-autoloader
        test ! -L "$bridge_consumer/vendor/oxhq/drove"
        test ! -e "$bridge_consumer/vendor/oxhq/drove/.temp"
        cat > "$bridge_consumer/bridge-boundary.php" <<'PHP'
        <?php

        require __DIR__.'/vendor/autoload.php';

        if (function_exists('test')) {
            throw new RuntimeException('The Pest bridge was autoloaded before explicit boot.');
        }

        Drove\Bridge\Pest\Bootstrap::boot();

        if (! function_exists('test') || ! class_exists(Pest\Kernel::class)) {
            throw new RuntimeException('The explicit Pest bridge did not boot.');
        }
        PHP
        php "$bridge_consumer/bridge-boundary.php"
        test "$("$bridge_consumer/vendor/bin/drove" --pest --version)" = "Drove 0.4.0-alpha.2"
        test "$("$bridge_consumer/vendor/bin/drove" --version)" = "Drove 0.4.0-alpha.2"
        mkdir -p "$bridge_consumer/tests"
        cat > "$bridge_consumer/tests/PackageBoundaryTest.php" <<'PHP'
        <?php

        test('Pest is an explicit compatibility bridge', function (): void {
            expect(class_exists(Drove\Bridge\Pest\Bridge::class))->toBeTrue();
        });
        PHP
        cache_directory="$(
          cd "$bridge_consumer"
          php -r 'echo sys_get_temp_dir().DIRECTORY_SEPARATOR."drove-pest-".hash("sha256", (string) getcwd());'
        )"
        test ! -e "$cache_directory"
        (
          cd "$bridge_consumer"
          vendor/bin/pest --colors=never --compact
        )
        test -d "$cache_directory"
        test "$(stat -c '%a' "$cache_directory")" = 700
