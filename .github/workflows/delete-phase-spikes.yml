name: Delete verified Phase spikes

on:
  push:
    branches:
      - refactor/phase-1
    paths:
      - .github/workflows/delete-phase-spikes.yml

concurrency:
  group: delete-verified-phase-spikes
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: read

env:
  TARGET_BRANCH: refactor/phase-1
  GATED_SHA: 463512881571a9ba7151ad1caf4ebba06c82880d
  PHASE_0_SHA: 7be3a10e8d2d20a6608fd109f82dab903a17e265
  PHASE_1_SHA: b78c1fa48f264a53dc4986477a4ba4864c1ebee0
  PHASE_2_SHA: a7c73773d8e760935ec4cd144b9606d5d89c8cc8
  PHASE_3_SHA: 13e44f83a974288169b79c8cfdc42bacaf5be7df

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BEFORE_SHA: ${{ github.event.before }}

    steps:
      - name: Checkout the one-shot add commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify one-shot trigger and exact parent
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = "oxhq/drove"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          test "$BEFORE_SHA" = "$GATED_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          read -ra parents <<< "$(git rev-list --parents --max-count=1 "$GITHUB_SHA")"
          test "${#parents[@]}" -eq 2
          test "${parents[1]}" = "$GATED_SHA"

          change="$(git diff-tree --no-commit-id --name-status -r "$GATED_SHA" "$GITHUB_SHA")"
          test "$change" = $'A\t.github/workflows/delete-phase-spikes.yml'

          remote_target="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"
          test "$remote_target" = "$GITHUB_SHA"$'\t'"refs/heads/$TARGET_BRANCH"

      - name: Verify successful gated workflow runs
        shell: bash
        run: |
          set -euo pipefail

          require_success() {
            local workflow="$1"
            local expected_name="$2"
            local response latest

            response="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f head_sha="$GATED_SHA" \
                -f event=pull_request \
                -f per_page=100
            )"

            latest="$(
              jq -c \
                --arg sha "$GATED_SHA" \
                --arg branch "$TARGET_BRANCH" \
                --arg name "$expected_name" \
                '[.workflow_runs[] | select(
                  .head_sha == $sha and
                  .head_branch == $branch and
                  .name == $name and
                  .event == "pull_request"
                )] | max_by(.run_number) // empty' <<< "$response"
            )"

            test -n "$latest"
            test "$(jq -r '.status' <<< "$latest")" = "completed"
            test "$(jq -r '.conclusion' <<< "$latest")" = "success"
          }

          require_success tests.yml "Tests"
          require_success static.yml "Static Analysis"
          require_success phase-one.yml "Drove Phase 1"

      - name: Verify exact refs and ancestry
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin \
            "+refs/heads/spike/phase-0:refs/remotes/origin/spike/phase-0" \
            "+refs/heads/spike/phase-1:refs/remotes/origin/spike/phase-1" \
            "+refs/heads/spike/phase-2:refs/remotes/origin/spike/phase-2" \
            "+refs/heads/spike/phase-3:refs/remotes/origin/spike/phase-3"

          while read -r branch expected; do
            actual="$(git rev-parse "refs/remotes/origin/$branch")"
            test "$actual" = "$expected"
            git merge-base --is-ancestor "$expected" "$GITHUB_SHA"
          done <<EOF
          spike/phase-0 $PHASE_0_SHA
          spike/phase-1 $PHASE_1_SHA
          spike/phase-2 $PHASE_2_SHA
          spike/phase-3 $PHASE_3_SHA
          EOF

      - name: Verify no open PR heads and atomically delete refs
        shell: bash
        run: |
          set -euo pipefail

          open_spike_prs="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq '.[] | . as $pr | select(
                ["spike/phase-0", "spike/phase-1", "spike/phase-2", "spike/phase-3"] |
                index($pr.head.ref)
              ) | "#\($pr.number) \($pr.head.label) \($pr.html_url)"'
          )"
          test -z "$open_spike_prs"

          remote_target="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH")"
          test "$remote_target" = "$GITHUB_SHA"$'\t'"refs/heads/$TARGET_BRANCH"

          git push --atomic \
            --force-with-lease="refs/heads/spike/phase-0:$PHASE_0_SHA" \
            --force-with-lease="refs/heads/spike/phase-1:$PHASE_1_SHA" \
            --force-with-lease="refs/heads/spike/phase-2:$PHASE_2_SHA" \
            --force-with-lease="refs/heads/spike/phase-3:$PHASE_3_SHA" \
            origin \
            :refs/heads/spike/phase-0 \
            :refs/heads/spike/phase-1 \
            :refs/heads/spike/phase-2 \
            :refs/heads/spike/phase-3

          remaining="$(
            git ls-remote --heads origin \
              refs/heads/spike/phase-0 \
              refs/heads/spike/phase-1 \
              refs/heads/spike/phase-2 \
              refs/heads/spike/phase-3
          )"
          test -z "$remaining"
